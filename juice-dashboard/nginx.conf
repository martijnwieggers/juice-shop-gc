server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/metrics-proxy/([^/]+)$ {
        resolver 127.0.0.11 valid=30s;
        set $target $1;
        proxy_pass https://$target/metrics;
        proxy_ssl_server_name on;
        proxy_set_header Host $target;
    }
}
